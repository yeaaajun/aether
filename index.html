<h1>PROJECT <span>AETHER</span></h1>
<p>하늘 대륙 “에테르”가 추락한 뒤 세계는 조각난 대지로 남았다. 땅속 깊은 곳에는 푸른 에테르 결정이 잠들어 있다.</p>

<small>A/D 이동 · W/Space 점프 · 좌클릭 채굴 · 우클릭 설치/설치물 상호작용<br>1~0·휠 슬롯 선택 · E 가방/기본제작 · F 양손 교체 · Q 왼손에 들기<br>작업대/화로/상자 우클릭으로 UI 열기 · K 저장 · Esc 메뉴 · T 채팅</small>
</div></div>
<script>
'use strict';

/* ============ 0. 멀티플레이 (PeerJS P2P, 호스트 권한) ============ */
const MP = {
  peer: null,
  conns: new Map(),
  hostConn: null,
  isHost: false,
  roomCode: null,
  myName: 'P' + (Math.random()*900+100|0),
  remotes: new Map(),
  active: false,
  lastSend: 0,
  inputMode: false,
  selfId: null,
  locate: true
};

function pidHue(id) {
  if (!id) return 200;
  let h = 0;
  for (let i = 0; i < id.length; i++) h = Math.imul(h ^ id.charCodeAt(i), 2654435761) >>> 0;
  return h % 360;
}
function pidColors(id) {
  const h = pidHue(id);
  return {
    body: `hsl(${h}, 65%, 55%)`,
    legs: `hsl(${(h + 40) % 360}, 55%, 42%)`,
    head: `hsl(${(h + 200) % 360}, 45%, 30%)`,
    name: `hsl(${h}, 90%, 75%)`
  };
}

const mpMsg = (type, data) => JSON.stringify({ t: type, d: data });

function mpBroadcast(obj, exceptId) {
  if (!MP.isHost) return;
  const s = typeof obj === 'string' ? obj : mpMsg(obj.t, obj.d);
  for (const [pid, c] of MP.conns) {
    if (pid !== exceptId && c.open) { try { c.send(s); } catch(e){} }
  }
}
function mpSendToHost(obj) {
  if (MP.hostConn && MP.hostConn.open) {
    try { MP.hostConn.send(typeof obj === 'string' ? obj : mpMsg(obj.t, obj.d)); } catch(e){}
  }
}

function mpPackWorld() {
  sync();
  const chests = [];
  for (const [k, v] of CHESTS) chests.push([k, v]);
  return {
    seed, time, sel, dim,
    port: PORT,
    p: [P.x, P.y],
    inv, eq,
    chests,
    w0: { rle: rle(DIM[0].world), wl: rle(DIM[0].wl), hs: DIM[0].heights },
    w1: DIM[1] ? { rle: rle(DIM[1].world), wl: rle(DIM[1].wl), hs: DIM[1].heights } : null
  };
}
function mpApplyWorld(d) {
  seed = d.seed;
  DIM[0] = { world: unrle(d.w0.rle), wl: unrle(d.w0.wl), heights: d.w0.hs };
  DIM[1] = d.w1 ? { world: unrle(d.w1.rle), wl: unrle(d.w1.wl), heights: d.w1.hs } : null;
  PORT[0] = d.port ? d.port[0] : null;
  PORT[1] = d.port ? d.port[1] : null;
  dim = d.dim || 0;
  ({ world, wl, heights } = DIM[dim]);
  time = d.time;
  sel = d.sel || 0;
  inv.splice(0, inv.length, ...d.inv);
  for (const k in eq) eq[k] = null;
  Object.assign(eq, d.eq);
  CHESTS.clear();
  for (const [k, v] of (d.chests || [])) CHESTS.set(k, v);
  scanTorches();
  Object.assign(P, { x: d.p[0], y: d.p[1], vx: 0, vy: 0 });
  dirty = true;
}

function mpStatus(msg) { const e = document.getElementById('mpStatus'); if (e) e.textContent = msg; }

function mpDisconnect(silent) {
  if (!MP.active && !MP.peer) return;
  MP.active = false;
  if (MP.peer) { try { MP.peer.destroy(); } catch(e){} }
  MP.peer = null; MP.conns.clear(); MP.remotes.clear();
  if (MP.hostConn) { try { MP.hostConn.close(); } catch(e){} }
  MP.hostConn = null;
  MP.isHost = false; MP.roomCode = null; MP.selfId = null;
  const rc = document.getElementById('roomCode'); if (rc) rc.hidden = true;
  const jr = document.getElementById('joinRow'); if (jr) jr.hidden = true;
  if (!silent) mpStatus('연결이 종료되었습니다.');
}

function mpHost() {
  mpDisconnect(true);
  const code = Math.random().toString(36).slice(2, 8).toUpperCase();
  MP.isHost = true; MP.active = true; MP.roomCode = code;
  mpStatus('서버 연결 중...');
  MP.peer = new Peer('aether-' + code, { debug: 0 });
  MP.peer.on('open', id => {
    MP.selfId = id;
    mpStatus('방 코드를 친구에게 알려주세요');
    const rc = document.getElementById('roomCode');
    rc.textContent = '방 코드: ' + code;
    rc.hidden = false;
  });
  MP.peer.on('error', err => {
    if (err.type === 'unavailable-id') { mpStatus('코드 충돌, 다시 시도하세요'); mpDisconnect(true); }
    else { mpStatus('오류: ' + err.type); mpDisconnect(true); }
  });
  MP.peer.on('connection', conn => {
    conn.on('open', () => {
      MP.conns.set(conn.peer, conn);
      if (!MP.remotes.has(conn.peer)) MP.remotes.set(conn.peer, { name: '플레이어', x: 0, y: 0, face: 1, sw: null, swT: 0, swId: 0, last: 0 });
      const players = [];
      for (const [pid, r] of MP.remotes) if (pid !== conn.peer) players.push({ id: pid, name: r.name, x: r.x, y: r.y });
      try { conn.send(mpMsg('init', { world: mpPackWorld(), name: MP.myName, hostId: MP.selfId, players })); } catch(e){}
      mpStatus(`접속자 ${MP.conns.size + 1}명 (본인 포함)`);
    });
    conn.on('data', raw => mpHandleHost(conn, raw));
    conn.on('close', () => {
      const name = MP.remotes.get(conn.peer)?.name || '플레이어';
      MP.conns.delete(conn.peer);
      MP.remotes.delete(conn.peer);
      mpBroadcast({ t: 'leave', d: { id: conn.peer, name } });
      addChat('시스템', `${name} 님이 나갔습니다.`);
      mpStatus(`접속자 ${MP.conns.size + 1}명 (본인 포함)`);
    });
    conn.on('error', () => {});
  });
}

function mpJoin(code) {
  mpDisconnect(true);
  MP.isHost = false; MP.active = true; MP.roomCode = code;
  mpStatus('연결 중...');
  MP.peer = new Peer({ debug: 0 });
  MP.peer.on('open', id => {
    MP.selfId = id;
    const conn = MP.peer.connect('aether-' + code, { reliable: true });
    MP.hostConn = conn;
    conn.on('open', () => { mpSendToHost({ t: 'hello', d: { name: MP.myName } }); });
    conn.on('data', raw => mpHandleClient(raw));
    conn.on('close', () => {
      mpStatus('호스트와 연결이 끊겼습니다.');
      toast('호스트와의 연결이 끊겼습니다.');
      MP.active = false; MP.hostConn = null; MP.remotes.clear();
    });
    conn.on('error', () => mpStatus('연결 실패. 코드를 확인하세요.'));
  });
  MP.peer.on('error', err => { mpStatus('오류: ' + err.type); MP.active = false; });
}

function mpHandleHost(conn, raw) {
  let m; try { m = JSON.parse(raw); } catch(e){ return; }
  const id = conn.peer;
  switch (m.t) {
    case 'hello': {
      const name = m.d.name || '플레이어';
      if (MP.remotes.has(id)) MP.remotes.get(id).name = name;
      else MP.remotes.set(id, { name, x: 0, y: 0, face: 1, sw: null, swT: 0, swId: 0, last: 0 });
      mpBroadcast({ t: 'join', d: { id, name } }, id);
      try { conn.send(mpMsg('pos', { id: MP.selfId, name: MP.myName, x: P.x, y: P.y, face: P.face, sw: null, swT: 0, swId: 0 })); } catch(e){}
      addChat('시스템', `${name} 님이 접속했습니다.`);
      mpStatus(`접속자 ${MP.conns.size + 1}명 (본인 포함)`);
      break;
    }
    case 'pos': {
      const r = MP.remotes.get(id);
      if (r) Object.assign(r, m.d, { last: performance.now() });
      mpBroadcast({ t: 'pos', d: { id, ...m.d } }, id);
      break;
    }
    case 'break': {
      const { x, y } = m.d;
      if (x < 0 || x >= W || y < 0 || y >= H) break;
      const i = y * W + x, tid = world[i];
      if (!tid) break;
      const origTile = tid;
      breakTile(x, y);
      mpBroadcast({ t: 'break', d: { x, y, tile: origTile } }, id);
      break;
    }
    case 'place': {
      const { x, y, tile, wl: wlv } = m.d;
      if (x < 0 || x >= W || y < 0 || y >= H) break;
      const i = y * W + x;
      if (wlv !== undefined) { wl[i] = wlv; }
      else {
        world[i] = tile;
        if (tile === TORCH) TL.add(i);
        if (tile === CHEST) { const key = x + ',' + y; if (!CHESTS.has(key)) CHESTS.set(key, Array(27).fill(null)); }
      }
      mpBroadcast({ t: 'place', d: { x, y, tile: world[i], wl: wlv } }, id);
      break;
    }
    case 'chest': {
      // 상자 내용 동기화
      CHESTS.set(m.d.key, m.d.items);
      mpBroadcast({ t: 'chest', d: m.d }, id);
      break;
    }
    case 'chat': {
      const name = MP.remotes.get(id)?.name || '플레이어';
      addChat(name, m.d.text);
      mpBroadcast({ t: 'chat', d: { id, name, text: m.d.text } }, id);
      break;
    }
  }
}

function mpHandleClient(raw) {
  let m; try { m = JSON.parse(raw); } catch(e){ return; }
  switch (m.t) {
    case 'init': {
      mpApplyWorld(m.d.world);
      if (m.d.hostId) MP.hostId = m.d.hostId;
      if (m.d.hostId) {
        MP.remotes.set(m.d.hostId, { name: '호스트', x: P.x, y: P.y, face: 1, sw: null, swT: 0, swId: 0, last: performance.now() });
      }
      for (const p of (m.d.players || [])) {
        if (p.id !== MP.selfId && p.id !== m.d.hostId) MP.remotes.set(p.id, { name: p.name, x: p.x, y: p.y, face: 1, last: performance.now() });
      }
      toast('방에 접속했습니다.');
      mpStatus('접속됨 (호스트: ' + MP.roomCode + ')');
      startGame();
      break;
    }
    case 'pos':
      MP.remotes.set(m.d.id, { ...(MP.remotes.get(m.d.id) || { name: '플레이어' }), ...m.d, last: performance.now() });
      break;
    case 'join':
      MP.remotes.set(m.d.id, { ...(MP.remotes.get(m.d.id) || { name: m.d.name }), name: m.d.name, last: performance.now() });
      addChat('시스템', `${m.d.name} 님이 접속했습니다.`);
      break;
    case 'leave': {
      const nmv = MP.remotes.get(m.d.id)?.name || m.d.name || '플레이어';
      MP.remotes.delete(m.d.id);
      addChat('시스템', `${nmv} 님이 나갔습니다.`);
      break;
    }
    case 'break': {
      const i = m.d.y * W + m.d.x;
      world[i] = AIR;
      if (m.d.tile === TORCH) TL.delete(i);
      if (m.d.tile === CHEST) CHESTS.delete(m.d.x + ',' + m.d.y);
      break;
    }
    case 'place': {
      const i = m.d.y * W + m.d.x;
      if (m.d.wl !== undefined) wl[i] = m.d.wl;
      else {
        world[i] = m.d.tile;
        if (m.d.tile === TORCH) TL.add(i);
        if (m.d.tile === CHEST) { const key = m.d.x + ',' + m.d.y; if (!CHESTS.has(key)) CHESTS.set(key, Array(27).fill(null)); }
      }
      break;
    }
    case 'chest':
      CHESTS.set(m.d.key, m.d.items);
      if (chestOpenKey === m.d.key) renderChestUI();
      break;
    case 'chat':
      addChat(m.d.name, m.d.text);
      break;
  }
}

function mpTick(dt) {
  if (!MP.active) return;
  MP.lastSend += dt;
  if (MP.lastSend < 0.05) return;
  MP.lastSend = 0;
  const payload = { x: P.x, y: P.y, face: P.face, sw: P.sw, swT: P.swT, swId: P.swId || 0, dim };
  if (MP.isHost) mpBroadcast({ t: 'pos', d: { id: MP.selfId, name: MP.myName, ...payload } });
  else mpSendToHost({ t: 'pos', d: payload });
}

function addChat(name, text) {
  const c = document.getElementById('chat');
  if (!c) return;
  const el = document.createElement('div');
  el.textContent = `<${name}> ${text}`;
  c.appendChild(el);
  setTimeout(() => el.remove(), 6000);
  while (c.children.length > 8) c.firstChild.remove();
}

// ★ 상자 동기화 헬퍼 (호스트/클라 공통)
function syncChest(key) {
  const items = CHESTS.get(key);
  if (!items) return;
  if (MP.active) {
    if (MP.isHost) mpBroadcast({ t: 'chest', d: { key, items } });
    else mpSendToHost({ t: 'chest', d: { key, items } });
  }
}

/* ============ 1. 설정 / 데이터 ============ */
const W=500,H=220,SEA=62,GRAV=50,JUMP=19,SPEED=8.5,REACH=5.5,DAY=240;

let seed=1;
const mulberry32=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),u=x-xi,v=y-yi,s=u*u*(3-2*u),t=v*v*(3-2*v),a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*s+(c-a)*t+(a-b-c+d)*s*t};

const SEAL=SEA+4;

const TREES={0:[LOG,LEAF,.13,'r'],3:[LOG,LEAF,.03,'r'],4:[ALOG,ALEAF,.06,'f'],5:[JLOG,JLEAF,.22,'j'],7:[BLOG,BLEAF,.17,'r'],8:[SLOG,SLEAF,.15,'c']};

function vein(R,t,n,y0,y1,len,host=STONE){for(let i=0;i<n;i++){let x=R()*W|0,y=y0+(R()*(y1-y0)|0);
  for(let k=0;k<len;k++){if(getT(x,y)===host)world[y*W+x]=t;x=clamp(x+(R()*3|0)-1,1,W-2);y=clamp(y+(R()*3|0)-1,1,H-3)}}}
function tree(x,gy,lg,lf,shape,R){
  const th=shape==='j'?9+(R()*5|0):shape==='c'?7+(R()*4|0):shape==='f'?4+(R()*3|0):5+(R()*4|0),top=gy-th;
  const put=(xx,yy)=>{if(xx>=0&&xx<W&&yy>=0&&world[yy*W+xx]===AIR)world[yy*W+xx]=lf};
  for(let y=gy-1;y>=top;y--)world[y*W+x]=lg;
  if(shape==='c')for(let y=top-2;y<=top+th-3;y++){const r=Math.min(3,(y-top+3)>>1);for(let dx=-r;dx<=r;dx++)put(x+dx,y)}
  else if(shape==='f'){for(let dx=-3;dx<=3;dx++)put(x+dx,top-1);for(let dx=-1;dx<=1;dx++)put(x+dx,top-2)}
  else{const q=shape==='j'?3:2;for(let dy=-q;dy<=1;dy++)for(let dx=-q;dx<=q;dx++)if(Math.abs(dx)+Math.abs(dy)<=q+1)put(x+dx,top+dy)}}

function generate(sd){
  seed=sd|0;world=new Uint8Array(W*H);wl=new Uint8Array(W*H);heights=[];dim=0;DIM[0]=DIM[1]=null;PORT[0]=PORT[1]=null;CHESTS.clear();const R=mulberry32(seed*7+1);
  for(let x=0;x<W;x++){const k=kx(x),b=biomeAt(x);let h=SEA-8+(fbm(x/60,5)-.5)*40+(vn(x/12,1)-.5)*4;
    if(b===1||b===3)h=SEA-8+(h-SEA+8)*(b===1?.4:.55);
    heights[x]=Math.round(h+Math.max(clamp((60-k)/20,0,1),clamp((k-455)/20,0,1))*26)}
  for(let x=0;x<W;x++){const h=heights[x],S=SURF[biomeAt(x)];
    for(let y=h;y<H;y++){const d=y-h;let t;
      if(y>=H-1||(y===H-2&&R()<.5))t=BED;
      else if(d===0)t=S[0];else if(d<(S[2]||4+x%3))t=S[1];else t=STONE;
      if(t!==BED&&d>4&&(Math.abs(fbm(x/20,y/14)-.5)<.03||(d>30&&fbm(x/38+90,y/26)>.64)))t=AIR;
      world[y*W+x]=t}
    for(let y=SEAL;y<h;y++)world[y*W+x]=WATER}
  vein(R,COPPER,300,SEA+8,H-10,9);vein(R,COAL,320,SEA+5,H-12,10);vein(R,IRON,170,SEA+45,H-8,8);vein(R,SILVER,110,SEA+70,H-8,7);
  vein(R,GOLD,80,SEA+95,H-6,6);vein(R,CRYSTAL,80,SEA+95,H-6,6);vein(R,MITHRIL,40,SEA+115,H-6,5);vein(R,EMERALD,30,SEA+100,H-6,3);vein(R,DIAMOND,24,SEA+120,H-6,3);
  for(let x=4,last=-9;x<W-4;x++){const b=biomeAt(x),tr=TREES[b];
    if(!tr||heights[x]>SEAL||x-last<(b===5?3:4)||R()>tr[2])continue;last=x;tree(x,heights[x],tr[0],tr[1],tr[3],R)}
  TL.clear()}

function genAether(){
  const s0=seed;seed=s0^0x5bd1e995;const R=mulberry32(seed),cx=W/2;world=new Uint8Array(W*H);wl=new Uint8Array(W*H);heights=Array(W).fill(H);
  for(let x=0;x<W;x++)for(let y=24,up=true;y<H-24;y++){if(fbm(x/26,y/15)>.57+Math.abs(y-100)/170){world[y*W+x]=up?AGRASS:ASTONE;up=false}else up=true}
  for(let dx=-9;dx<=9;dx++){for(let y=86;y<100;y++)world[y*W+cx+dx]=AIR;for(let dy=0;dy<=(6-Math.abs(dx)/2|0);dy++)world[(100+dy)*W+cx+dx]=dy?ASTONE:AGRASS}
  for(const [t,n,l] of [[CRYSTAL,140,7],[MITHRIL,90,5],[AORE,70,4],[DIAMOND,35,3],[EMERALD,35,3],[GOLD,40,5]])vein(R,t,n,30,H-30,l,ASTONE);
  for(let x=4,last=-9;x<W-4;x++){if(x-last<5||R()>.1)continue;
    for(let y=26;y<H-26;y++)if(world[y*W+x]===AGRASS&&getT(x,y-1)===AIR&&getT(x,y-9)===AIR){last=x;tree(x,y,ELOG,ELEAF,'r',R);break}}
  seed=s0;DIM[1]={world,wl,heights};PORT[1]=[cx,99]}

const spawnX=()=>{for(let d=0;d<80;d++)for(const x of[W/2+d,W/2-d]){const h=heights[x];if(h<=SEAL&&!TILES[getT(x,h-1)].s&&!TILES[getT(x,h-2)].s&&!TILES[getT(x,h-3)].s)return x}return W/2};
function scanTorches(){TL.clear();for(let i=0;i<world.length;i++)if(world[i]===TORCH)TL.add(i)}
function sync(){DIM[dim]={world,wl,heights}}
function enter(d){
  sync();dim=d;if(DIM[d])({world,wl,heights}=DIM[d]);else genAether();
  const sx=d?W/2:spawnX(),sy=d?99:heights[sx]-1;let pt=PORT[d];
  if(!(pt&&getT(pt[0],pt[1])===PORTAL)){world[sy*W+sx]=world[(sy-1)*W+sx]=PORTAL;pt=PORT[d]=[sx,sy]}
  scanTorches();Object.assign(P,{x:pt[0]+.1,y:pt[1]+1-P.h-.02,vx:0,vy:0});portalCD=2;toast(d?'에테르 차원에 도착했습니다 ✨':'오버월드로 돌아왔습니다')}

const P={x:0,y:0,w:.8,h:1.8,vx:0,vy:0,face:1,onGround:false,sw:null,swT:0,swId:0};
const keys={},mouse={x:0,y:0,l:false,r:false};
function hitB(x,y,w,h){let r=null;const x1=Math.floor(x+w-1e-4),y1=Math.floor(y+h-1e-4);
  for(let ty=Math.floor(y);ty<=y1;ty++)for(let tx=Math.floor(x);tx<=x1;tx++)for(const b of boxes(tx,ty))
    if(x<tx+b[2]&&x+w>tx+b[0]&&y<ty+b[3]&&y+h>ty+b[1]){r=r||[1e9,-1e9,1e9,-1e9];r[0]=Math.min(r[0],tx+b[0]);r[1]=Math.max(r[1],tx+b[2]);r[2]=Math.min(r[2],ty+b[1]);r[3]=Math.max(r[3],ty+b[3])}
  return r}
const hit=(x,y,w,h)=>!!hitB(x,y,w,h);
function resetPlayer(){const sx=spawnX();Object.assign(P,{x:sx+.1,y:heights[sx]-3,vx:0,vy:0,face:1})}

const stepUp=nx=>P.onGround?[.501,1.001].find(s=>!hit(nx,P.y-s,P.w,P.h)):0;
function physics(dt){
  const ax=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  P.vx=ax*SPEED*(getT(Math.floor(P.x+P.w/2),Math.floor(P.y+P.h*.6))===WATER?.6:1);if(ax)P.face=ax;
  if((keys.KeyW||keys.Space||keys.ArrowUp)&&P.onGround){P.vy=-JUMP;P.onGround=false}
  const lad=getT(Math.floor(P.x+P.w/2),Math.floor(P.y+P.h/2))===LADDER;
  if(lad)P.vy=((keys.KeyS||keys.ArrowDown)?6:0)-((keys.KeyW||keys.ArrowUp||keys.Space)?6:0);else if(getT(Math.floor(P.x+P.w/2),Math.floor(P.y+P.h*.6))===WATER)P.vy=clamp(P.vy+GRAV*.25*dt-((keys.KeyW||keys.Space||keys.ArrowUp)?45*dt:0),-6,5);
  else P.vy=Math.min(P.vy+GRAV*dt,38);
  const nx=P.x+P.vx*dt;
  if(!hit(nx,P.y,P.w,P.h))P.x=nx;
  else if(stepUp(nx)){P.y-=stepUp(nx);P.x=nx}
  else{const r=hitB(nx,P.y,P.w,P.h);if(P.vx>0)P.x=r[0]-P.w-1e-3;else if(P.vx<0)P.x=r[1]+1e-3}

  c.fillStyle=A('legs')||'#2b2f66';c.fillRect(x+w*.1,y+h*.66+s,w*.32,h*.34-s);c.fillRect(x+w*.58,y+h*.66-s,w*.32,h*.34+s);

  c.fillStyle='#f1caa0';c.fillRect(x+w*.06,y,w*.88,h*.3);
  c.fillStyle=A('head')||'#3a2a20';c.fillRect(x+w*.06,y,w*.88,h*(A('head')?.17:.1));
  c.fillStyle='#111';c.fillRect(x+w*(face>0?.62:.22),y+h*.14,w*.14,h*.06);
  if(!sw)for(const [hk,fx] of [['R',face>0?.86:.14],['L',face>0?.1:.9]])if(eq[hk])c.drawImage(spr(eq[hk].id),x+w*fx-h*.17,y+h*.48,h*.34,h*.34);
  if(sw){c.save();c.translate(x+w*(face>0?.8:.2),y+h*.45);c.scale(face,1);c.rotate(-.5+Math.sin(P.swT*13)*1.1);
    if(P.swId)c.drawImage(spr(P.swId),0,-h*.8,h*.8,h*.8);else{c.fillStyle='#f1caa0';c.fillRect(0,-h*.08,h*.2,h*.16)}c.restore()}}

/* ============ 8. UI ============ */
const ICN={},icon=id=>`<img src="${ICN[id]||(ICN[id]=spr(id).toDataURL())}" alt="">`;
const slotHTML=(s,i,hb)=>`<div class="slot${hb&&i===sel?' sel':''}" data-i="${i}">${s?icon(s.id)+(s.n>1?`<b>${s.n}</b>`:''):''}${hb?`<em>${(i+1)%10}</em>`:''}</div>`;
function renderInv(){
  $('#hotbar').innerHTML=inv.slice(0,10).map((s,i)=>slotHTML(s,i,1)).join('');
  if(!panelOpen)return;renderEq();
  $('#grid').innerHTML=inv.map((s,i)=>slotHTML(s,i,i<10)).join('');
  $('#recipes').innerHTML=BASIC_RECIPES.map((r,i)=>`<button class="rc" data-r="${i}" ${canCraft(r)?'':'disabled'}>${icon(r.out)}<span><b>${nm(r.out)} ×${r.n}</b><br>${Object.entries(r.in).map(([k,n])=>nm(+k)+' '+n).join(', ')}</span></button>`).join('')}
function renderEq(){
  const f=([k,l])=>`<div class="slot" data-e="${k}" title="${l}">${eq[k]?icon(eq[k].id):`<small>${l}</small>`}</div>`;
  $('#eqL').innerHTML=[['head','투구'],['body','갑옷'],['legs','각반'],['L','왼손']].map(f).join('');
  $('#eqR').innerHTML=[['p','곡괭이'],['a','도끼'],['h','망치'],['R','오른손']].map(f).join('');
  const pc=$('#pv').getContext('2d');pc.imageSmoothingEnabled=false;pc.clearRect(0,0,72,120);drawPlayer(pc,16,14,40,90,1,null);
  $('#stat').innerHTML='🛡 방어력 '+defense()+'<br>가방에서 클릭=장착 · 장비칸 클릭=해제'}

// ★ 작업대 UI
function renderBenchUI() {
  $('#benchGrid').innerHTML = inv.map((s,i)=>slotHTML(s,i,i<10)).join('');
  $('#benchRecipes').innerHTML = BENCH_RECIPES.map((r,i)=>`<button class="rc" data-br="${i}" ${canCraft(r)?'':'disabled'}>${icon(r.out)}<span><b>${nm(r.out)} ×${r.n}</b><br>${Object.entries(r.in).map(([k,n])=>nm(+k)+' '+n).join(', ')}</span></button>`).join('');
}
// ★ 화로 UI
function renderFurnUI() {
  $('#furnGrid').innerHTML = inv.map((s,i)=>slotHTML(s,i,i<10)).join('');
  $('#furnRecipes').innerHTML = FURN_RECIPES.map((r,i)=>`<button class="rc" data-fr="${i}" ${canCraft(r)?'':'disabled'}>${icon(r.out)}<span><b>${nm(r.out)} ×${r.n}</b><br>${Object.entries(r.in).map(([k,n])=>nm(+k)+' '+n).join(', ')}</span></button>`).join('');
}
// ★ 상자 UI
function renderChestUI() {
  if (!chestOpenKey) return;
  const items = CHESTS.get(chestOpenKey);
  if (!items) return;
  $('#chestGrid').innerHTML = items.map((s,i)=>`<div class="slot" data-ci="${i}">${s?icon(s.id)+(s.n>1?`<b>${s.n}</b>`:''):''}</div>`).join('');
  $('#chestInvGrid').innerHTML = inv.map((s,i)=>slotHTML(s,i,i<10)).join('');
}

function openBench() {
  closeAllStations();
  $('#benchPanel').hidden = false;
  panelOpen = false; $('#panel').hidden = true;
  renderBenchUI();
}
function openFurnace() {
  closeAllStations();
  $('#furnPanel').hidden = false;
  panelOpen = false; $('#panel').hidden = true;
  renderFurnUI();
}
function openChest(tx, ty) {
  closeAllStations();
  const key = tx + ',' + ty;
  if (!CHESTS.has(key)) CHESTS.set(key, Array(27).fill(null));
  chestOpenKey = key;
  $('#chestPanel').hidden = false;
  panelOpen = false; $('#panel').hidden = true;
  renderChestUI();
}
function closeChest() {
  chestOpenKey = null;
  $('#chestPanel').hidden = true;
}
function closeAllStations() {
  closeChest();
  $('#benchPanel').hidden = true;
  $('#furnPanel').hidden = true;
}

// 제작 버튼 핸들러
$('#benchRecipes').onclick = e => {
  const b = e.target.closest('.rc');
  if (b) { craft(BENCH_RECIPES[+b.dataset.br]); renderBenchUI(); renderInv(); }
};
$('#furnRecipes').onclick = e => {
  const b = e.target.closest('.rc');
  if (b) { craft(FURN_RECIPES[+b.dataset.fr]); renderFurnUI(); renderInv(); }
};

// 작업대/화로 인벤토리 슬롯 클릭 → 선택만 (아이템 이동은 드래그 없이 클릭 스왑)
$('#benchGrid').onclick = e => {
  const s = e.target.closest('.slot'); if (!s) return;
  const i = +s.dataset.i;
  [inv[i], inv[sel]] = [inv[sel], inv[i]]; dirty = true;
  renderBenchUI(); renderInv();
};
$('#furnGrid').onclick = e => {
  const s = e.target.closest('.slot'); if (!s) return;
  const i = +s.dataset.i;
  [inv[i], inv[sel]] = [inv[sel], inv[i]]; dirty = true;
  renderFurnUI(); renderInv();
};

// ★ 상자 클릭: 상자↔가방 아이템 이동
$('#chestGrid').onclick = e => {
  const s = e.target.closest('[data-ci]'); if (!s) return;
  const ci = +s.dataset.ci;
  const items = CHESTS.get(chestOpenKey); if (!items) return;
  const cur = items[ci];
  if (cur) {
    // 상자 → 가방
    let added = false;
    for (const invIt of inv) {
      if (invIt && invIt.id === cur.id && !(IT[cur.id] && IT[cur.id].slot)) { invIt.n += cur.n; added = true; break; }
    }
    if (!added) {
      const idx = inv.indexOf(null);
      if (idx >= 0) { inv[idx] = cur; added = true; }
    }
    if (added) { items[ci] = null; dirty = true; syncChest(chestOpenKey); }
  } else {
    // 가방 → 상자 (선택 슬롯)
    const it = inv[sel];
    if (it) {
      let added = false;
      for (let k = 0; k < items.length; k++) {
        if (items[k] && items[k].id === it.id && !(IT[it.id] && IT[it.id].slot)) { items[k].n += it.n; added = true; break; }
      }
      if (!added) {
        const idx = items.indexOf(null);
        if (idx >= 0) { items[idx] = it; added = true; }
      }
      if (added) { inv[sel] = null; dirty = true; syncChest(chestOpenKey); }
    }
  }
  renderChestUI(); renderInv();
};
$('#chestInvGrid').onclick = e => {
  const s = e.target.closest('.slot'); if (!s) return;
  sel = +s.dataset.i; dirty = true;
  renderChestUI(); renderInv();
};

let toastT=0,hintT=0;
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2200)}
function hint(m){if(performance.now()-hintT>1800){hintT=performance.now();toast(m)}}
function updateHud(){
  const tt=time/DAY%1,hr=(6+tt*24)%24|0,mn=((6+tt*24)%1*60)|0,dp=Math.max(0,Math.round(P.y+P.h-heights[Math.floor(P.x)]));
  const cnt = MP.active ? (1 + MP.remotes.size) : 0;
  $('#hud').innerHTML=`${dim?'에테르 차원':BIOME[biomeAt(Math.floor(P.x))]} · 깊이 ${dp}m · ${String(hr).padStart(2,'0')}:${String(mn).padStart(2,'0')} ${tt<.5?'☀️':'🌙'}${MP.active?`<br>👥 ${cnt}명 · ${MP.isHost?'호스트':'클라이언트'} · ${MP.roomCode||''}`:''}<br>🛡 방어력 ${defense()}`;
}
function togglePanel(){
  closeAllStations();
  panelOpen=!panelOpen;$('#panel').hidden=!panelOpen;dirty=true;
  if (panelOpen) renderInv();
}
$('#hotbar').onclick=e=>{const s=e.target.closest('.slot');if(s){sel=+s.dataset.i;dirty=true}};
$('#grid').onclick=e=>{const s=e.target.closest('.slot');if(!s)return;const i=+s.dataset.i,it=inv[i]&&IT[inv[i].id];
  if(it&&it.slot)[eq[it.slot],inv[i]]=[inv[i],eq[it.slot]];else[inv[i],inv[sel]]=[inv[sel],inv[i]];dirty=true;renderInv()};
$('#eq').onclick=e=>{const d=e.target.closest('[data-e]'),k=d&&d.dataset.e;if(!k)return;
  if(eq[k]){if(inv.includes(null)){addItem(eq[k].id,eq[k].n);eq[k]=null}}
  else if((k==='R'||k==='L')&&inv[sel]){eq[k]=inv[sel];inv[sel]=null}
  dirty=true;renderInv()};
$('#recipes').onclick=e=>{const b=e.target.closest('.rc');if(b){craft(BASIC_RECIPES[+b.dataset.r]);renderInv()}};

/* ============ 9. 저장 / 불러오기 ============ */
const KEY='aether-save-v2';
const hasSave=()=>{try{return!!localStorage.getItem(KEY)}catch(e){return false}};
function rle(a){const o=[];let v=a[0],c=1;for(let i=1;i<a.length;i++){if(a[i]===v&&c<65535)c++;else{o.push(v,c);v=a[i];c=1}}o.push(v,c);return o}
function unrle(r){const a=new Uint8Array(W*H);let i=0;for(let k=0;k<r.length;k+=2){a.fill(r[k],i,i+r[k+1]);i+=r[k+1]}return a}
const pack=d=>d&&{rle:rle(d.world),wl:rle(d.wl),hs:d.heights};
function save(auto){
  try{
    sync();
    const chests = [];
    for (const [k, v] of CHESTS) chests.push([k, v]);
    localStorage.setItem(KEY, JSON.stringify({
      v:4, seed, time, sel, dim, port: PORT, inv, eq, p: [P.x, P.y],
      chests,
      ...pack(DIM[0]), ae: pack(DIM[1])
    }));
    if(!auto)toast('월드를 저장했습니다 💾');
  } catch(e){ toast('저장에 실패했습니다'); }
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));if(!s||s.v<2||s.v>4)return false;
    const un=o=>o&&{world:unrle(o.rle),wl:unrle(o.wl),heights:o.hs};
    seed=s.seed;DIM[0]=un(s);DIM[1]=un(s.ae)||null;
    PORT[0]=s.port?s.port[0]:null;PORT[1]=s.port?s.port[1]:null;dim=s.dim||0;
    ({world,wl,heights}=DIM[dim]);scanTorches();
    inv.splice(0,inv.length,...s.inv);for(const k in eq)eq[k]=null;Object.assign(eq,s.eq);sel=s.sel;time=s.time;Object.assign(P,{x:s.p[0],y:s.p[1],vx:0,vy:0});
    CHESTS.clear();
    for (const [k, v] of (s.chests || [])) CHESTS.set(k, v);
    return true;
  }catch(e){console.error(e);return false}
}

/* ============ 10. 입력 / 메인 루프 ============ */
let state='menu',last=0,acc=0,hudT=0,saveT=0;
function showMenu(){$('#menu').hidden=false;$('#bResume').hidden=!world;$('#bLoad').disabled=!hasSave()}
function startGame(){state='play';$('#menu').hidden=true;dirty=true;keys.KeyA=keys.KeyD=keys.KeyW=keys.Space=false}
function toggleMenu(){
  if(!world)return;
  if(state==='play'){state='menu';save(true);closeAllStations();panelOpen=false;$('#panel').hidden=true;showMenu();}
  else startGame();
}
$('#bNew').onclick=()=>{const v=parseInt($('#seed').value);generate(isNaN(v)?Math.random()*1e9|0:v);resetPlayer();inv.fill(null);for(const k in eq)eq[k]=null;sel=0;time=DAY*.08;startGame();toast('통나무 → 판자 → 작업대 → 나무 도구 순으로 만들어 보세요 (E)')};
$('#bLoad').onclick=()=>{if(load())startGame();else toast('저장된 월드가 없습니다')};
$('#bResume').onclick=startGame;$('#bSave').onclick=()=>save();$('#bMenu').onclick=toggleMenu;

$('#bLoc').onclick = () => {
  MP.locate = !MP.locate;
  $('#bLoc').style.opacity = MP.locate ? '1' : '.4';
  toast('플레이어 로케이터 ' + (MP.locate ? 'ON' : 'OFF'));
};

$('#bHost').onclick = () => {
  if (!world) {
    const v = parseInt($('#seed').value);
    generate(isNaN(v) ? Math.random()*1e9|0 : v);
    resetPlayer();
    inv.fill(null); for (const k in eq) eq[k] = null; sel = 0; time = DAY*.08;
  }
  mpHost();
};
$('#bJoinMode').onclick = () => { const jr = $('#joinRow'); jr.hidden = !jr.hidden; };
$('#bJoinGo').onclick = () => {
  const code = ($('#joinCode').value || '').trim().toUpperCase();
  if (code.length !== 6) { mpStatus('6자리 코드를 입력하세요'); return; }
  mpJoin(code);
};
$('#joinCode').addEventListener('keydown', e => { if (e.key === 'Enter') $('#bJoinGo').click(); });

addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','Tab'].includes(e.code))e.preventDefault();
  keys[e.code]=true;if(e.repeat)return;
  if(e.code==='Escape'){
    // ★ Esc: 열린 패널 닫기 우선
    if (!$('#benchPanel').hidden || !$('#furnPanel').hidden || !$('#chestPanel').hidden) { closeAllStations(); return; }
    return toggleMenu();
  }
  if(e.code==='KeyT'&&MP.active&&!MP.inputMode){
    e.preventDefault();
    MP.inputMode=true;
    $('#chatInput').hidden=false;
    $('#chatBox').value='';
    $('#chatBox').focus();
    return;
  }
  if(MP.inputMode)return;
  if(state!=='play')return;
  if(e.code==='KeyE'||e.code==='Tab')togglePanel();
  else if(e.code==='KeyK')save();
  else if(e.code==='KeyF')swapHands();
  else if(e.code==='KeyQ'){[inv[sel],eq.L]=[eq.L,inv[sel]];dirty=true}
  else if(/^Digit\d$/.test(e.code)){sel=(+e.code[5]+9)%10;dirty=true}});
$('#chatBox')?.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const text = $('#chatBox').value.trim();
    if (text && MP.active) {
      if (MP.isHost) {
        addChat(MP.myName, text);
        mpBroadcast({ t: 'chat', d: { id: MP.selfId, name: MP.myName, text } });
      } else {
        mpSendToHost({ t: 'chat', d: { text } });
      }
    }
    $('#chatInput').hidden = true;
    $('#chatBox').value = '';
    MP.inputMode = false;
    e.stopPropagation();
  } else if (e.key === 'Escape') {
    $('#chatInput').hidden = true;
    MP.inputMode = false;
  }
});
$('#chatBox')?.addEventListener('blur', () => {
  setTimeout(() => { if (!document.activeElement || document.activeElement.id !== 'chatBox') { $('#chatInput').hidden = true; MP.inputMode = false; } }, 100);
});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.l=mouse.r=false});
addEventListener('pagehide',()=>{if(world)save(true)});
cv.addEventListener('mousedown',e=>{if(e.button===0)mouse.l=true;if(e.button===2)mouse.r=true;mouse.x=e.offsetX;mouse.y=e.offsetY});
cv.addEventListener('mousemove',e=>{mouse.x=e.offsetX;mouse.y=e.offsetY});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{sel=(sel+(e.deltaY>0?1:9))%10;dirty=true});
addEventListener('mouseup',e=>{if(e.button===0)mouse.l=false;if(e.button===2)mouse.r=false});
function resize(){cv.width=cv.clientWidth;cv.height=cv.clientHeight;T=Math.max(14,Math.round(cv.height/32));ctx.imageSmoothingEnabled=false}
addEventListener('resize',resize);
function loop(now){
  requestAnimationFrame(loop);const dt=Math.min(.1,(now-last)/1000||0);last=now;
  if(!world){ctx.fillStyle='#0b0f24';ctx.fillRect(0,0,cv.width,cv.height);return}
  if(state==='play'){
    acc+=dt;while(acc>=1/120){physics(1/120);acc-=1/120}
    interact(dt);leafDecay();time+=dt;portalCD-=dt;
    if(portalCD<=0&&getT(Math.floor(P.x+P.w/2),Math.floor(P.y+P.h/2))===PORTAL){
      if(!MP.active || MP.isHost) enter(1-dim);
    }
    else if(dim&&P.y>H-6){toast('허공으로 추락했습니다');if(!MP.active||MP.isHost)enter(0)}
    mpTick(dt);
    saveT+=dt;hudT+=dt;
    if(saveT>30){saveT=0;save(true)}
    if(dirty){renderInv();dirty=false;if(chestOpenKey)renderChestUI();if(!$('#benchPanel').hidden)renderBenchUI();if(!$('#furnPanel').hidden)renderFurnUI();}
    if(hudT>.25){hudT=0;updateHud()}}
  render()}
resize();showMenu();renderInv();requestAnimationFrame(loop);
</script>
